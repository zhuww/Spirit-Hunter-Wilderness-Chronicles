<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Spirit Hunter: Wilderness Chronicles</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
      @import url('https://fonts.googleapis.com/css2?family=Cinzel:wght@400;700&family=Cormorant+Garamond:ital,wght@0,400;0,600;1,400&display=swap');
      
      body {
        font-family: 'Cormorant Garamond', serif;
        background-color: #0c0a09; /* Stone-950 */
        color: #e7e5e4;
        overflow: hidden;
      }
      
      h1, h2, h3, h4, h5, h6, .font-cinzel {
        font-family: 'Cinzel', serif;
      }

      /* Custom Scrollbar - Minimal */
      ::-webkit-scrollbar {
        width: 6px;
      }
      ::-webkit-scrollbar-track {
        background: transparent; 
      }
      ::-webkit-scrollbar-thumb {
        background: #57534e; 
        border-radius: 10px;
      }
      
      /* --- TIMELESS UI STYLES --- */
      
      .ink-panel {
        background: linear-gradient(to bottom, rgba(28, 25, 23, 0.95), rgba(12, 10, 9, 0.98));
        box-shadow: 0 0 40px rgba(0,0,0,0.8), inset 0 0 20px rgba(0,0,0,0.5);
        border: 1px solid rgba(120, 113, 108, 0.2);
        position: relative;
      }
      
      .ink-panel::before {
        content: '';
        position: absolute;
        inset: 0;
        background-image: url("https://www.transparenttextures.com/patterns/stardust.png");
        opacity: 0.1;
        pointer-events: none;
      }

      .parchment-panel {
        background-color: #e5e0d3;
        background-image: url("https://www.transparenttextures.com/patterns/paper-fibers.png");
        color: #292524;
        box-shadow: 0 4px 20px rgba(0,0,0,0.4);
        border: 1px solid #a8a29e;
      }

      .text-glow {
        text-shadow: 0 0 10px rgba(251, 191, 36, 0.3);
      }
      
      .text-ink {
        color: #1c1917;
        text-shadow: 0 0 1px rgba(0,0,0,0.1);
      }

      /* --- ANIMATIONS --- */
      
      @keyframes float {
        0%, 100% { transform: translateY(0px); }
        50% { transform: translateY(-8px); }
      }
      
      @keyframes smoke-drift {
        0% { transform: translateY(0) scale(0.95); opacity: 0; filter: blur(2px); }
        15% { transform: translateY(-10px) scale(1); opacity: 1; filter: blur(0px); }
        85% { transform: translateY(-40px) scale(1); opacity: 1; filter: blur(0px); }
        100% { transform: translateY(-50px) scale(1.05); opacity: 0; filter: blur(4px); }
      }

      @keyframes pulse-soft {
        0%, 100% { opacity: 0.8; }
        50% { opacity: 0.4; }
      }
      
      @keyframes breathe {
        0%, 100% { transform: scale(1); }
        50% { transform: scale(1.03); }
      }

      @keyframes walk-wobble {
        0% { transform: translateY(0) rotate(-1deg); }
        25% { transform: translateY(-3px) rotate(0deg); }
        50% { transform: translateY(0) rotate(1deg); }
        75% { transform: translateY(-3px) rotate(0deg); }
        100% { transform: translateY(0) rotate(-1deg); }
      }

      /* Leg Animations */
      @keyframes leg-swing-left {
        0% { transform: rotate(15deg); }
        50% { transform: rotate(-15deg); }
        100% { transform: rotate(15deg); }
      }

      @keyframes leg-swing-right {
        0% { transform: rotate(-15deg); }
        50% { transform: rotate(15deg); }
        100% { transform: rotate(-15deg); }
      }

      .animate-float { animation: float 6s ease-in-out infinite; }
      .animate-float-heavy { animation: float 4s ease-in-out infinite; }
      .animate-smoke { animation: smoke-drift 4s ease-out forwards; }
      .animate-pulse-soft { animation: pulse-soft 4s ease-in-out infinite; }
      .animate-breathe { animation: breathe 4s ease-in-out infinite; }
      .animate-walk { animation: walk-wobble 0.6s linear infinite; }
      .animate-leg-left { animation: leg-swing-left 0.6s linear infinite; transform-origin: top center; }
      .animate-leg-right { animation: leg-swing-right 0.6s linear infinite; transform-origin: top center; }

    </style>
  <script type="importmap">
{
  "imports": {
    "@google/genai": "https://aistudiocdn.com/@google/genai@^1.31.0",
    "react-dom/": "https://aistudiocdn.com/react-dom@^19.2.1/",
    "react/": "https://aistudiocdn.com/react@^19.2.1/",
    "react": "https://aistudiocdn.com/react@^19.2.1",
    "lucide-react": "https://aistudiocdn.com/lucide-react@^0.556.0"
  }
}
</script>
</head>
  <body>
    <div id="root"></div>
  </body>
</html>
